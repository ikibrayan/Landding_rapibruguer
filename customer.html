<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datos del Cliente</title>
  <link rel="stylesheet" href="./css/customer.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <div class="cart-header">
    <a href="./menu.html" class="back-button">←</a>
    <h2>FORMULARIO</h2>
  </div>

  <div class="logo">
    <img src="./img/logo.webp" alt="">
  </div>

  <main class="form-wrapper">
    <h2>Datos del Cliente</h2>
    <p>Completa tu información</p>

    <div class="formulario">
      <input type="text" id="nombre" placeholder="Tu nombre" required>
      <input type="text" id="direccion" placeholder="Dirección de entrega" required>
      <input type="number" id="telefono" placeholder="Número de contacto" required>

      <select id="entrega">
        <option>Domicilio</option>
        <option>Recoger</option>
      </select>

      <select id="pago">
        <option>Pago online</option>
        <option>Contra entrega</option>
      </select>

      <button class="enviar" onclick="finalizarPedido()">
        Enviar pedido <i class="fa-brands fa-whatsapp"></i>
      </button>
    </div>
  </main>

  <script src="./js/customer.js"></script>
</body>
</html>
