<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ofertas</title>
  <link rel="stylesheet" href="./css/offers.css" />
</head>
<body>
  <!-- HEADER -->
  <div class="offers-header">
    <a href="./select.html" class="back-button">←</a>
    <h2>OFERTAS</h2>
  </div>

  <!-- CONTENIDO -->
  <div class="offers-container">
    <!-- Oferta 1 -->
    <div class="offer-card">
      <img src="./img/offer.jpg" alt="Oferta 1">
      <div class="offer-info">
        <h3>Combo Especial</h3>
        <p>Hamburguesa + papas + bebida</p>
        <div class="price-row">
          <span class="price">$9.99</span>
          <button class="buy-btn">Añadir</button>
        </div>
      </div>
    </div>

    <!-- Oferta 2 -->
    <div class="offer-card">
      <img src="./img/offer2.jpg" alt="Oferta 2">
      <div class="offer-info">
        <h3>Pizza Mediana 2x1</h3>
        <p>¡Solo hoy!</p>
        <div class="price-row">
          <span class="price">$14.99</span>
          <button class="buy-btn">Añadir</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
