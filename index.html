<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante - Pedido Rápido</title>
  <link rel="stylesheet" href="./css/index.css">
</head>
<body>

<header>
  <h1>🍽️ Bienvenido a Nuestro Restaurante</h1>
  <p>Haz tu pedido fácil y rápido</p>
</header>

<section id="menu">
  <h2>Menú</h2>
  
  <div style="display: flex; flex-direction: column; margin-bottom: 15px; max-width: 300px;">
    <label for="categoriaSelect" style="font-weight: bold; margin-bottom: 5px;">Elegir categoría:</label>
    <select id="categoriaSelect" style="text-align: left;">
        <option value="hamburguesa">Hamburguesas</option>
        <option value="pizza">Pizzas</option>
        <option value="taco">Tacos</option>
        <option value="burrito">Burritos</option>
    </select>
  </div>
  
  <div id="productos"></div>
</section>

<section class="formulario">
  <h2>Datos del Cliente</h2>
  <input type="text" id="nombre" placeholder="Tu nombre" required>
  <input type="text" id="direccion" placeholder="Dirección de entrega" required>
  <input type="text" id="telefono" placeholder="Número de contacto" required>
  <select id="entrega">
    <option>Domicilio</option>
    <option>Recoger</option>
  </select>
  <select id="pago">
    <option>Pago online</option>
    <option>Contra entrega</option>
  </select>
</section>

<section class="carrito">
  <h2>Total: $<span id="total">0</span></h2>
  <button class="enviar" onclick="enviarPedido()">Enviar pedido por WhatsApp</button>
</section>

<script src="./js/index.js"></script>

</body>
</html>
