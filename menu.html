<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart UI</title>
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <!-- HEADER -->
  <div class="cart-header">
    <a href="./select.html" class="back-button">←</a>
    <h2>MENÚ</h2>
  </div>

  <div class="select-categorias">
    <select id="categoriaSelect" onchange="filtrarCategoria(this.value)">
      <option value="">Selecciona una categoría</option>
      <option value="hamburguesa">🍔 Hamburguesas</option>
      <option value="pizza">🍕 Pizzas</option>
      <option value="taco">🌮 Tacos</option>
      <option value="burrito">🌯 Burritos</option>
    </select>
  </div>


  <div class="cart-items"></div>

  <!-- FOOTER -->
  <div class="cart-footer">
    <span>$28.55</span>
    <button class="pay">Realizar Pedido</button>
  </div>


    <script src="./js/menu.js"></script>
</body>
</html>
