<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart UI</title>
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <!-- HEADER -->
  <div class="cart-header">
    <a href="./select.html" class="back-button">←</a>
    <h2>MENÚ</h2>
  </div>

 <!-- CATEGORÍAS -->

<div class="categorias-container">
  <button class="categoria-btn active" onclick="filtrarBotonCategoria(this, 'pizza')">
    <img src="./img/pizza.png" alt="Pizza" />
    <span>Pizza</span>
  </button>
  <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'steak')">
    <img src="./img/steak.png" alt="Steak" />
    <span>Steak</span>
  </button>
  <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'burger')">
    <img src="./img/burger.png" alt="Burger" />
    <span>Burger</span>
  </button>
  <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'chicken')">
    <img src="./img/chicken.png" alt="Chicken" />
    <span>Chicken</span>
  </button>
</div>





  <div class="cart-items"></div>

  <!-- FOOTER -->
  <div class="cart-footer">
    <span>$28.55</span>
    <button class="pay">Realizar Pedido</button>
  </div>


    <script src="./js/menu.js"></script>
</body>
</html>
