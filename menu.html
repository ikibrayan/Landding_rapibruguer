<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante - Pedido Rápido</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/card.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<header></header>

<section id="menu" style="text-align: center;">
  <h2>Menú</h2>

<div class="carousel-categorias">
  <div class="carousel-inner">
    <button onclick="filtrarCategoria('hamburguesa')">
      <img src="img/burguer-button.webp" alt="Hamburguesas">
      <span>Hamburguesas</span>
    </button>
    <button onclick="filtrarCategoria('pizza')">
      <img src="img/chicken-button.webp" alt="Pizzas">
      <span>Pizzas</span>
    </button>
    <button onclick="filtrarCategoria('taco')">
      <img src="img/hod-dog-button.webp" alt="Tacos">
      <span>Tacos</span>
    </button>
    <button onclick="filtrarCategoria('burrito')">
      <img src="img/potato-button.webp" alt="Burritos">
      <span>Burritos</span>
    </button>
  </div>
</div>



  <div id="productos"></div>
</section>

<section class="carrito">
  <h2>Total: $<span id="total">0</span></h2>
  <button class="enviar" onclick="guardarYContinuar()">Ordenar ahora <i class="fa-brands fa-whatsapp"></i></button>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <span class="close-button" onclick="cerrarModal()">×</span>
    <img id="modal-img" src="" alt="" />
    <div class="modal-body">
      <h3 id="modal-titulo"></h3>
      <p id="modal-descripcion"></p>
      <p id="modal-detalle" style="font-style: italic; color: #555;"></p>
      <p class="precio" id="modal-precio"></p>
    </div>
  </div>
</div>

<script src="./js/menu.js"></script>

</body>
</html>
