<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menú</title>
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/customer.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <!-- HEADER -->
  <div class="cart-header">
    <a href="./select.html" class="back-button">←</a>
    <h2>MENÚ</h2>
  </div>

  <!-- CATEGORÍAS -->
  <div class="categorias-container">
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'hamburguesa')">
      <img src="./img/burguer.webp" alt="Burger" />
      <span>Burger</span>
    </button>
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'pizza')">
      <img src="./img/pizza.webp" alt="Pizza" />
      <span>Pizza</span>
    </button>
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'burrito')">
      <img src="./img/wrap.webp" alt="Steak" />
      <span>Steak</span>
    </button>
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'taco')">
      <img src="./img/chicken-leg.webp" alt="Chicken" />
      <span>Chicken</span>
    </button>
  </div>

  <!-- PRODUCTOS DINÁMICOS -->
  <div class="cart-items"></div>

  <!-- FOOTER -->
  <div class="cart-footer">
    <span id="total-price">$0</span>
    <button class="pay" id="btnPedido">
      Realizar Pedido <i class="fa-brands fa-whatsapp"></i>
    </button>
  </div>

  <!-- PANEL DESPLEGABLE FORMULARIO -->
  <div id="formOverlay" class="overlay">
    <div class="headerForm">
      <h3>Resumen del pedido</h3>
      <button id="closeForm">×</button>
    </div>

    <!-- CONTENIDO FORMULARIO -->
    <div class="formulario">

      <!-- Resumen de productos -->
      <div class="resumen-pedido" id="resumenPedido"></div>

      <!-- Total -->
      <div class="total-linea">
        <span>Total:</span>
        <strong id="totalResumen">$0</strong>
      </div>

      <!-- Datos del cliente -->
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Tu nombre" required maxlength="60">

      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" placeholder="Dirección de entrega" required maxlength="30">

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" placeholder="Número de contacto" required>

      <label for="observaciones">Notas</label>
      <textarea id="observaciones" placeholder="Observaciones (opcional)" maxlength="200"></textarea>

      <label for="entrega">Entrega</label>
      <select id="entrega">
        <option value="Domicilio">Domicilio</option>
        <option value="Recoger">Recoger</option>
      </select>

      <label for="pago">Método de pago</label>
      <select id="pago">
        <option>Pago Nequi / Daviplata</option>
        <option>Contra entrega</option>
      </select>

      <button class="enviar" onclick="finalizarPedido()">
        Enviar pedido <i class="fa-brands fa-whatsapp"></i>
      </button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="./js/menu.js"></script>
  <script src="./js/customer.js"></script>
</body>
</html>
