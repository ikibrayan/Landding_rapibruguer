<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante - Pedido Rápido</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/card.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<header>
 
</header>
  

<section id="menu" style="text-align: center;">
  <h2>Menú</h2>
  
  <div style="display: flex; flex-direction: column; margin-bottom: 15px; max-width: 300px;">
    <label for="categoriaSelect" style="font-weight: bold; margin-bottom: 5px;">Elegir categoría:</label>
    <select id="categoriaSelect" style="text-align: left;">
        <option value="hamburguesa">Hamburguesas</option>
        <option value="pizza">Pizzas</option>
        <option value="taco">Tacos</option>
        <option value="burrito">Burritos</option>
    </select>
  </div>
  
  <div id="productos"></div>
</section>

<section class="carrito">
  <h2>Total: $<span id="total">0</span></h2>
  <button class="enviar" onclick="guardarYContinuar()">Ordenar ahora <i class="fa-brands fa-whatsapp"></i></button>
</section>


<div id="modal" class="modal hidden">
  <div class="modal-content">
    <span class="close-button" onclick="cerrarModal()">×</span>
    <img id="modal-img" src="" alt="" />
    <div class="modal-body">
      <h3 id="modal-titulo"></h3>
      <p id="modal-descripcion"></p>
      <p id="modal-detalle" style="font-style: italic; color: #555;"></p>
      <p class="precio" id="modal-precio"></p>
    </div>
  </div>
</div>



<script src="./js/menu.js"></script>

</body>
</html>
