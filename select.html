<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Bebidas</title>
  <link rel="stylesheet" href="./css/select.css" />
</head>
<body>

  <!-- Header moderno con curva -->
  <header class="curved-header">
    <div class="content">
      <h1>RAPIBURGER</h1>
      <p>tu mejor opcion en comida</p>
    </div>
    <div class="logo-circle">
      <img class="front-img" src="./img/logo.webp" alt="">
    </div>
  </header>

  <!-- Contenido principal -->
  <div class="app-container">
    <!-- Título -->
    <div class="search-container">
      <h1>Elije una opción</h1>
    </div>

    <!-- Lista de bebidas en columna -->
    <div class="product-grid">
      <div class="product-card" onclick="window.location.href='menu.html'" style="background-color: darkred;">
        <img src="./img/menu.png" alt="Menu" />
        <span class="card-subtitle">Menú</span>
      </div>

      <div class="product-card" onclick="window.location.href='offers.html'" style="background-color: orange;">
        <img src="./img/special-tag.png" alt="Ofertas" />
        <span class="card-subtitle">Ofertas</span>
      </div>

      <div class="product-card" onclick="window.location.href='map.html'" style="background-color: teal;">
        <img src="./img/map.png" alt="Mapa" />
        <span class="card-subtitle">Mapa</span>
      </div>
    </div>
  </div>

</body>
</html>
