<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Bebidas</title>

  <!-- Tu CSS -->
  <link rel="stylesheet" href="./css/select.css" />

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>

<header class="curved-header"></header>

<!-- Contenido principal -->
<div class="app-container">
  <img class="img-logo" src="./img/logo.webp" alt="">
  <h1>Elige alguna de las opciones</h1>
 
  <!-- Carrusel envuelto en un contenedor -->
  <div class="carousel-wrapper">
    <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active">
          <a href="menu.html">
            <img src="./img/menu3.jpeg" class="d-block w-100" alt="Menú">
            <div class="carousel-caption d-none d-md-block">
              <h5>Menú</h5>
              <p>Explora nuestras opciones de bebidas</p>
            </div>
          </a>
        </div>

        <div class="carousel-item">
          <a href="offers.html">
            <img src="./img/offer-tag2.jpeg" class="d-block w-100" alt="Ofertas">
            <div class="carousel-caption d-none d-md-block">
              <h5>Ofertas</h5>
              <p>Promociones exclusivas para ti</p>
            </div>
          </a>
        </div>

        <div class="carousel-item">
          <a href="map.html">
            <img src="./img/map3.jpeg" class="d-block w-100" alt="Mapa">
            <div class="carousel-caption d-none d-md-block">
              <h5>Mapa</h5>
              <p>Encuentra nuestras sucursales</p>
            </div>
          </a>
        </div>
      </div>

      <!-- Botones de control -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
