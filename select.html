<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Bebidas</title>
  <link rel="stylesheet" href="./css/select.css" />
</head>
<body>
    
<div class="top-deco-header"></div>

  <div class="app-container">
    <!-- Header tipo logo -->
    <header class="logo-header">
      <img src="./img/logo.webp" alt="Logo de la App Bebidas"/>
    </header>

    <!-- Barra de búsqueda -->
    <div class="search-container">
        <h1>Tu mejor opciónen comida</h1>
    </div>

    <!-- Lista de productos -->
    <div class="product-grid">
      <div class="product-card" style="background-color: #f44336;">
        <img src="https://via.placeholder.com/80x120/ffffff?text=A" alt="Bebida A" />
      </div>
      <div class="product-card" style="background-color: #cfcfcf;">
        <img src="https://via.placeholder.com/80x120/ffffff?text=B" alt="Bebida B" />
      </div>
      <div class="product-card" style="background-color: #7b1fa2;">
        <img src="https://via.placeholder.com/80x120/ffffff?text=C" alt="Bebida C" />
      </div>
      <div class="product-card" style="background-color: #212121;">
        <img src="https://via.placeholder.com/80x120/ffffff?text=D" alt="Bebida D" />
      </div>
    </div>
  </div>

  <!-- Footer decorativo -->
  <div class="bottom-deco-footer"></div>

</body>
</html>
