<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Bebidas</title>
  <link rel="stylesheet" href="./css/select.css" />
</head>
<body>

  <!-- Header moderno con curva -->
  <header class="curved-header">
    <div class="header-content">
      <div class="header-text">
        <h2>Texto</h2>
        <p>Explora nuestras opciones</p>
        <span class="tag">Recomendado</span>
      </div>
      <div class="header-image">
        <img src="./img/logo.webp" alt="Logo de la App Bebidas" />
      </div>
    </div>
    <svg class="header-curve" viewBox="0 0 500 150" preserveAspectRatio="none">
      <path d="M0,100 C150,200 350,0 500,100 L500,00 L0,0 Z" style="fill:#1b1f34;"></path>
    </svg>
  </header>

  <!-- Contenido principal -->
  <div class="app-container">
    <!-- Título -->
    <div class="search-container">
      <h1>Elije una opción</h1>
    </div>

    <!-- Lista de bebidas en columna -->
    <div class="product-grid">
      <div class="product-card" onclick="window.location.href='menu.html'">
        <img src="./img/menu.jpg" alt="Menu" />
        <span class="card-subtitle">Menú</span>
      </div>

      <div class="product-card" onclick="window.location.href='map.html'">
        <img src="./img/map.jpg" alt="Mapa" />
        <span class="card-subtitle">Mapa</span>
      </div>

      <div class="product-card" onclick="window.location.href='offers.html'">
        <img src="./img/offers.jpg" alt="Ofertas" />
        <span class="card-subtitle">Ofertas</span>
      </div>
    </div>
  </div>

</body>
</html>
